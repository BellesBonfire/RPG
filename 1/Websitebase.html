<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="playerStats">
        <h2>Player Stats</h2>
        <p id="playerName"></p>
        <p id="playerHP"></p>
        <p id="playerAtkPower"></p>
        <p id="playerSpeed"></p>
        <p id="playerPotions"></p>
  </div>
  <div id="log"></div>
  <div id="enemyStats">
        <p id="enemyName"></p>
        <p id="enemyHP"></p>
        <p id="enemyAtkPower"></p>
        <p id="enemySpeed"></p>
  </div>
  <div id="buttonContainer">
        <button id="moveBtn">Move</button>
        <button id="attackBtn">Attack</button>
        <button id="healBtn">Heal</button>
        <button id="inventoryBtn">Inventory</button>
        <button id="equipBtn">Equip</button>
        <button id="unequipBtn">Unequip</button>
        <button id="lootBtn">Search</button>
        <button id="restartBtn">Restart Game</button>
  </div> 
       
  <script src="Textbase.js"></script>
</body>
</html>
