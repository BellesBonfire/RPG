<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-layout">
    <div class="statsColumn">
      <div class="statBox">
        <h2>Player Stats</h2>
        <div id="playerStats">Enter your name to begin.</div>
      </div>
    </div>

    <div class="game-main">
      <div id="log">
        <form name="introForm">
          <input name="Username" placeholder="Enter your name">
          <button type="submit">Start Game</button>
        </form>
      </div>

      <div id="inventoryPanel" class="inventoryPanel hidden">
        <h2>Inventory</h2>
        <div id="equippedItems" class="equippedItems">Equipped: None</div>
        <div id="inventoryItems" class="inventoryItems"></div>
        <div class="inventoryActions">
          <button id="closeInventoryBtn" type="button">Close Inventory</button>
        </div>
      </div>

      <div id="buttonContainer">
        <button id="moveBtn">Move</button>
        <button id="attackBtn">Attack</button>
        <button id="healBtn">Heal</button>
        <button id="inventoryBtn">Inventory</button>
        <button id="lootBtn">Search</button>
        <button id="restartBtn">Restart Game</button>
      </div>
    </div>

    <div class="statsColumn">
      <div class="statBox">
        <h2>Enemy Stats</h2>
        <div id="enemyStats">No enemy detected.</div>
      </div>
    </div>
  </div>

  <script src="Textbase.js"></script>
</body>
</html>
